plugins { id 'com.android.application' }

android {
    namespace 'com.sroksrae.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sroksrae.game'
        minSdk 24
        targetSdk 34
        versionCode 11
        versionName '1.8.0'
    }

    buildTypes {
        release {
            // Prototype distribution: preserve the installed app's signing certificate.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
